name: nix:build
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Install Nix ❄
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Link Cachix 🔌
      uses: cachix/cachix-action@v17
      with:
        name: cofree-coffee
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    
    - name: Build 9.4.8 🔨
      run: nix build .#ghc948/cofree-bot

    - name: Build 9.6.7 🔨
      run: nix build .#ghc967/cofree-bot

    - name: Build 9.8.4 🔨
      run: nix build .#ghc984/cofree-bot

    - name: Build 9.10.3 🔨
      run: nix build .#ghc9103/cofree-bot

    - name: Build 9.12.4 🔨
      run: nix build .#ghc9124/cofree-bot
